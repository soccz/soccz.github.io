<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoGuard Roadview Site</title>
  <script>
    // ES3-safe integrity check: if the big engine script at the bottom never runs
    // (truncated download / too-old browser / blocked JS), say so on screen.
    // Chrome silently DISCARDS an unterminated <script> at EOF, so a timer-based
    // check from up here is the only reliable way to detect a cut-off file.
    window.__ecoParsed = false;
    window.__bootErr = null;
    window.__ecoShowErr = function (m) {
      var el = document.getElementById("loader");
      if (el) {
        el.className = "loader";
        if ("textContent" in el) { el.textContent = m; } else { el.innerText = m; }
      } else { document.title = m; }
    };
    window.onerror = function (msg) {
      if (!window.__ecoParsed) {
        window.__bootErr = String(msg);
        window.__ecoShowErr("스크립트를 실행하지 못했습니다: " + msg +
          " | 원인: 다운로드가 잘렸거나(파일 크기 확인) 브라우저가 오래되었습니다(최신 크롬/엣지 권장).");
      }
      return false;
    };
    window.__ecoCheck = function () {
      if (!window.__ecoParsed && !window.__bootErr) {
        window.__ecoShowErr("파일이 불완전합니다 — 다운로드가 중간에 잘렸습니다. 파일을 다시 내려받은 뒤 크기를 확인해 주세요.");
      }
    };
    if (window.addEventListener) {
      window.addEventListener("load", function () { setTimeout(window.__ecoCheck, 500); }, false);
    } else if (window.attachEvent) {
      window.attachEvent("onload", function () { setTimeout(window.__ecoCheck, 500); });
    }
    setTimeout(window.__ecoCheck, 6000);
  </script>
  <link rel="preload" as="image" href="satellite_assets/roadview_zones/zone_00_pano.jpg">
  <link rel="preload" as="image" href="satellite_assets/roadview_zones/zone_10_pano.jpg">
  <link rel="preload" as="image" href="satellite_assets/xai_minimap.png">
  <style>
    :root {
      --bg: #030706;
      --panel: rgba(5, 13, 12, .72);
      --panel-strong: rgba(5, 13, 12, .88);
      --line: rgba(226, 232, 240, .16);
      --text: #f2fff9;
      --muted: #b4c7bf;
      --hana: #22c7a0;
      --amber: #f3bf55;
      --shadow: 0 18px 46px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Pretendard", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    button {
      border: 0;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100%;
      background: #020504;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: 62px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 22px;
      background: rgba(3, 8, 7, .9);
      border-bottom: 1px solid rgba(226, 232, 240, .12);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 174px;
      font-size: 20px;
      font-weight: 850;
    }

    .mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(34, 199, 160, .55);
      border-radius: 7px;
      background: rgba(34, 199, 160, .14);
      color: #8dfadd;
      font-size: 15px;
      font-weight: 900;
    }

    .address {
      flex: 1;
      min-width: 0;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid rgba(226, 232, 240, .13);
      border-radius: 8px;
      background: rgba(5, 13, 12, .68);
      color: #d9fff2;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .address::before {
      content: "LIVE";
      flex: 0 0 auto;
      min-width: 36px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: rgba(34, 199, 160, .18);
      color: #8dfadd;
      font-family: Inter, "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      font-size: 10px;
      font-weight: 900;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #dcfff4;
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 16px rgba(243, 191, 85, .72);
    }

    .viewer {
      position: fixed;
      inset: 62px 0 0;
      overflow: hidden;
      cursor: grab;
      background: #050a09;
      user-select: none;
      touch-action: none;
    }

    .viewer:active { cursor: grabbing; }

    #glcanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* forward/back dash flash */
    .viewer::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse at 50% 60%, rgba(255, 255, 255, .18), transparent 18%),
        radial-gradient(ellipse at 50% 62%, transparent 0 34%, rgba(3, 7, 6, .26) 72%, rgba(3, 7, 6, .42) 100%);
      transform: scale(1);
    }

    .viewer.moving-forward::before { animation: road-jump-forward .3s ease-out; }
    .viewer.moving-back::before { animation: road-jump-back .26s ease-out; }

    @keyframes road-jump-forward {
      0% { opacity: .72; transform: scale(.9); }
      70% { opacity: .24; transform: scale(1.32); }
      100% { opacity: 0; transform: scale(1.46); }
    }

    @keyframes road-jump-back {
      0% { opacity: .5; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(.92); }
    }

    /* cinematic vignette + edge grade on top of the GL scene */
    .viewer::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(3, 7, 6, .34) 100%),
        linear-gradient(180deg, rgba(3, 7, 6, .06), transparent 30%, rgba(3, 7, 6, .3)),
        linear-gradient(90deg, rgba(3, 7, 6, .14), transparent 18%, transparent 82%, rgba(3, 7, 6, .12));
    }

    .compass {
      position: absolute;
      z-index: 8;
      right: 18px;
      top: 18px;
      width: 80px;
      height: 80px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(5, 13, 12, .68);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .compass span {
      position: absolute;
      top: 8px;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
    }

    .needle {
      width: 3px;
      height: 52px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff756c 0 50%, #d8fff4 50% 100%);
      transform: rotate(var(--heading, 16deg));
      transform-origin: center;
    }

    .nav-status {
      position: absolute;
      z-index: 8;
      left: 24px;
      bottom: 34px;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      border: 1px solid rgba(226, 232, 240, .14);
      border-radius: 999px;
      background: rgba(5, 13, 12, .68);
      color: #effff9;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 850;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .nav-status span { color: #8dfadd; }

    .controls {
      position: absolute;
      z-index: 9;
      left: 50%;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 9px;
      pointer-events: auto;
      border: 1px solid rgba(226, 232, 240, .14);
      border-radius: 999px;
      background: rgba(5, 13, 12, .72);
      padding: 8px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .control-btn {
      min-width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
      color: #f8fffc;
      font-size: 16px;
      font-weight: 900;
    }

    .control-btn.primary {
      min-width: 62px;
      height: 62px;
      background: rgba(34, 199, 160, .94);
      color: #04110d;
      font-size: 22px;
      box-shadow: 0 0 28px rgba(34, 199, 160, .34), inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .control-btn.active {
      background: rgba(34, 199, 160, .94);
      color: #04110d;
    }

    .control-btn:disabled {
      opacity: .34;
      cursor: not-allowed;
    }

    .waypoints {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .waypoint {
      width: 44px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .waypoint.active {
      background: var(--hana);
      box-shadow: 0 0 18px rgba(34, 199, 160, .42);
    }

    .zone-tag {
      position: absolute;
      z-index: 8;
      left: 24px;
      top: 24px;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      border: 1px solid rgba(226, 232, 240, .14);
      border-radius: 999px;
      background: rgba(5, 13, 12, .58);
      color: #eafff8;
      font-size: 12px;
      font-weight: 820;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .zone-tag b { color: #8dfadd; }

    .evidence-panel {
      position: absolute;
      z-index: 8;
      right: 24px;
      bottom: 24px;
      width: clamp(360px, 39vw, 594px);
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, .14);
      border-radius: 8px;
      background: rgba(5, 13, 12, .62);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .evidence-panel img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
    }

    .mini-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .mini-marker {
      position: absolute;
      width: 42px; height: 42px;
      margin: -21px 0 0 -21px;
      transition: left .34s cubic-bezier(.5, 0, .2, 1), top .34s cubic-bezier(.5, 0, .2, 1);
    }
    /* solid centre dot — clearly visible */
    .mini-marker::before {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 13px; height: 13px;
      margin: -6.5px 0 0 -6.5px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 12px rgba(243, 191, 85, 1), 0 0 0 2px rgba(3, 8, 7, .85);
      z-index: 2;
    }
    /* expanding scan ping */
    .mini-marker::after {
      content: "";
      position: absolute; inset: 6px;
      border-radius: 50%;
      border: 2px solid var(--amber);
      animation: mini-ping 1.7s ease-out infinite;
    }
    @keyframes mini-ping {
      0% { transform: scale(.4); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    /* slowly rotating crosshair reticle = "scan target locked" */
    .mini-reticle {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 3px rgba(3, 8, 7, .9));
      animation: mini-spin 6s linear infinite;
    }
    @keyframes mini-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .mini-marker::after, .mini-reticle { animation: none; }
    }

    .mini-coord {
      position: absolute;
      right: 8px; top: 8px;
      display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
      padding: 4px 8px;
      border-radius: 5px;
      background: rgba(4, 9, 8, .78);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px; font-weight: 800; line-height: 1.35;
      color: #eafff8;
    }
    .mini-coord b { color: #8dfadd; }
    .mini-coord span { color: rgba(234, 255, 248, .62); font-size: 8.5px; }

    .evidence-caption {
      position: absolute;
      left: 8px;
      bottom: 8px;
      display: inline-flex;
      flex-direction: column;
      gap: 1px;
      min-height: 34px;
      padding: 5px 9px 6px;
      border-radius: 5px;
      background: rgba(4, 9, 8, .76);
      color: #f7fffb;
      text-align: left;
      align-items: flex-start;
    }

    .evidence-caption b { font-size: 11px; font-weight: 900; }

    .evidence-caption span {
      color: rgba(234, 255, 248, .76);
      font-size: 9px;
      font-weight: 780;
    }

    .proof-badges {
      position: absolute;
      z-index: 8;
      left: 24px;
      top: 68px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      width: min(480px, calc(100vw - 48px));
    }

    .proof-badges span {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border: 1px solid rgba(226, 232, 240, .13);
      border-radius: 999px;
      background: rgba(5, 13, 12, .56);
      color: #eafff8;
      font-size: 11px;
      font-weight: 860;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .hint {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      padding: 6px 13px;
      border: 1px solid rgba(226, 232, 240, .14);
      border-radius: 999px;
      background: rgba(5, 13, 12, .62);
      color: #d8fff4;
      font-size: 12px;
      font-weight: 780;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      transition: opacity .5s ease;
    }

    .hint.gone { opacity: 0; pointer-events: none; }

    .loader {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background:
        radial-gradient(120% 80% at 50% 12%, rgba(34, 199, 160, .10), transparent 60%),
        radial-gradient(90% 60% at 50% 120%, rgba(243, 191, 85, .08), transparent 60%),
        #020504;
      color: #d8fff4;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      transition: opacity .55s ease;
    }

    .loader.done { opacity: 0; pointer-events: none; }

    .boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: min(440px, 82vw);
      animation: boot-in .6s ease both;
    }

    @keyframes boot-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .boot-mark {
      width: 54px; height: 54px;
      display: grid; place-items: center;
      border: 1px solid rgba(34, 199, 160, .5);
      border-radius: 14px;
      background: rgba(34, 199, 160, .12);
      color: #8dfadd;
      font-size: 26px; font-weight: 900;
      box-shadow: 0 0 40px rgba(34, 199, 160, .28), inset 0 1px 0 rgba(255, 255, 255, .12);
      animation: boot-pulse 2.2s ease-in-out infinite;
    }

    @keyframes boot-pulse {
      0%, 100% { box-shadow: 0 0 34px rgba(34, 199, 160, .22), inset 0 1px 0 rgba(255, 255, 255, .12); }
      50% { box-shadow: 0 0 58px rgba(34, 199, 160, .5), inset 0 1px 0 rgba(255, 255, 255, .16); }
    }

    .boot-title {
      font-size: 25px; font-weight: 900; letter-spacing: .5px;
      color: #f2fff9;
    }
    .boot-title span { color: #22c7a0; margin: 0 6px; }
    .boot-title small { color: #8dfadd; font-size: 13px; font-weight: 800; letter-spacing: 3px; }

    .boot-tag {
      color: #b4c7bf; font-size: 12.5px; font-weight: 700; letter-spacing: .3px;
      margin-top: -6px;
    }

    .boot-scan {
      width: 100%; height: 3px; border-radius: 999px;
      background: rgba(226, 232, 240, .1);
      overflow: hidden; margin-top: 4px;
    }
    .boot-scan i {
      display: block; height: 100%; width: 40%; border-radius: 999px;
      background: linear-gradient(90deg, transparent, #22c7a0 40%, #8dfadd 60%, transparent);
      animation: boot-scan 1.15s cubic-bezier(.5, 0, .5, 1) infinite;
    }
    @keyframes boot-scan { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

    .boot-status {
      min-height: 18px;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; font-weight: 700; letter-spacing: .2px;
      color: #8dfadd;
    }
    .boot-status::before { content: "▸ "; color: var(--amber); }

    @media (prefers-reduced-motion: reduce) {
      .boot-mark, .boot-scan i { animation: none; }
    }

    @media (max-width: 860px) {
      .topbar { height: 54px; padding: 0 12px; gap: 12px; }
      .brand { min-width: 0; font-size: 18px; }
      .address { display: none; }
      .status { display: none; }
      .viewer { inset: 54px 0 0; }
      .compass { width: 58px; height: 58px; right: 10px; top: 10px; }
      .needle { height: 36px; }
      .nav-status { left: 12px; bottom: 96px; font-size: 11px; }
      .zone-tag { left: 12px; top: 12px; }
      .proof-badges, .evidence-panel { display: none; }
      .controls { left: 0; right: 0; bottom: 12px; width: 100%; transform: none; }
      .control-group { max-width: calc(100vw - 16px); gap: 6px; padding: 6px; }
      .control-btn { min-width: 36px; height: 36px; font-size: 15px; }
      .control-btn.primary { min-width: 50px; height: 50px; }
      .waypoint { width: 34px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="mark">E</span><span>EcoGuard</span></div>
      <div class="address">ecoguard://GPS-111.79E-2.50S/roadview-zones</div>
      <div class="status">GPS 기반 현장 로드뷰 시연</div>
    </header>

    <section class="viewer" id="viewer" aria-label="EcoGuard roadview">
      <canvas id="glcanvas"></canvas>

      <div class="hint" id="hint">드래그로 둘러보기 · ↑ 전진 · 스크롤 이동</div>

      <div class="zone-tag"><b id="zoneLabel">P01</b><span id="zoneName">진입 숲길 · 정상 임상</span></div>
      <div class="proof-badges" aria-label="현장 분석 정보">
        <span>GPS 111.79E / 2.50S</span>
        <span id="damageBadge">훼손 진행 0%</span>
        <span>XAI CAM+Mask</span>
        <span>360 Pano</span>
      </div>

      <div class="compass" aria-hidden="true">
        <span>N</span>
        <div class="needle" id="needle"></div>
      </div>

      <div class="nav-status" aria-live="polite">
        <span id="distanceLabel">00m</span>
        <b id="headingLabel">016deg</b>
      </div>

      <div class="evidence-panel" aria-label="XAI 미니맵">
        <img src="satellite_assets/xai_minimap.png" alt="XAI 미니맵">
        <div class="mini-marker" id="miniMarker" style="left:24%; top:30%">
          <svg class="mini-reticle" viewBox="0 0 42 42" aria-hidden="true">
            <circle cx="21" cy="21" r="14" fill="none" stroke="#f3bf55" stroke-width="1.6" stroke-dasharray="5 3.5"></circle>
            <line x1="21" y1="1.5" x2="21" y2="8" stroke="#f3bf55" stroke-width="1.6"></line>
            <line x1="21" y1="34" x2="21" y2="40.5" stroke="#f3bf55" stroke-width="1.6"></line>
            <line x1="1.5" y1="21" x2="8" y2="21" stroke="#f3bf55" stroke-width="1.6"></line>
            <line x1="34" y1="21" x2="40.5" y2="21" stroke="#f3bf55" stroke-width="1.6"></line>
          </svg>
        </div>
        <div class="mini-coord">
          <b id="miniGps">2.5000°S 111.7900°E</b>
          <span id="miniPos">탐지 지점 · P01 · 00m</span>
        </div>
        <div class="evidence-caption">
          <b>XAI 미니맵</b>
          <span>CAM + mask evidence</span>
        </div>
      </div>

      <div class="controls">
        <div class="control-group" aria-label="로드뷰 이동 제어">
          <button class="control-btn" id="backBtn" type="button" aria-label="뒤 구역으로 이동">↓</button>
          <button class="control-btn" id="leftBtn" type="button" aria-label="왼쪽 회전">&lt;</button>
          <button class="control-btn primary" id="forwardBtn" type="button" aria-label="앞 구역으로 이동">↑</button>
          <button class="control-btn" id="rightBtn" type="button" aria-label="오른쪽 회전">&gt;</button>
          <button class="control-btn" id="resetBtn" type="button" aria-label="처음 구역으로 이동">0</button>
          <button class="control-btn" id="scanBtn" type="button" aria-label="자동 회전">↻</button>
        </div>
        <div class="waypoints" id="waypoints" aria-label="구역 바로 이동"></div>
      </div>

      <div class="loader" id="loader">
        <div class="boot">
          <div class="boot-mark">E</div>
          <div class="boot-title">EcoGuard<span>·</span><small>FIELD</small></div>
          <div class="boot-tag">위성 탐지 → 현장 검증 로드뷰</div>
          <div class="boot-scan"><i></i></div>
          <div class="boot-status" id="loaderStatus">시스템 초기화</div>
        </div>
      </div>
      <noscript><div class="loader">JavaScript가 꺼져 있어 실행할 수 없습니다 — 브라우저에서 JavaScript를 허용해 주세요.</div></noscript>
    </section>
  </main>

  <script>
    "use strict";
    const waypoints = [
      { code: "P01", name: "진입 숲길 · 정상 임상", distance: 0, damage: 0, mx: 25, my: 31, image: "satellite_assets/roadview_zones/zone_00_pano.jpg" },
      { code: "P02", name: "원시림 능선", distance: 10, damage: 0, mx: 71, my: 23, image: "satellite_assets/roadview_zones/zone_10_pano.jpg" },
      { code: "P03", name: "임연부 · 교란 시작", distance: 20, damage: 14, mx: 45, my: 73, image: "satellite_assets/roadview_zones/zone_20_pano.jpg" },
      { code: "P04", name: "벌목 전선", distance: 30, damage: 58, mx: 83, my: 59, image: "satellite_assets/roadview_zones/zone_30_pano.jpg" },
      { code: "P05", name: "개간 사면", distance: 40, damage: 83, mx: 30, my: 48, image: "satellite_assets/roadview_zones/zone_40_pano.jpg" },
      { code: "P06", name: "소실 지점 · 훼손 핵심부", distance: 50, damage: 100, mx: 41, my: 55, image: "satellite_assets/roadview_zones/zone_50_pano.jpg" }
    ];
    const BASE_HEADING = 16;      // compass offset (deg) at yaw 0
    const FOV_BASE = 96;          // vertical field of view (deg) - max the ~102deg band allows; pulls the forest back to presentation framing
    const CYL_H = 2.46;           // cylinder height (radius = 1) -> ~101deg, matches the equirect band (no vertical stretch)
    const PITCH_LIMIT = 0.05;     // up/down clamp (small margin left after the wide FOV)
    const DRAG_SENS = 0.0026;     // radians per pixel
    const TRANS_DUR_F = 0.95;     // seconds per forward zone transition
    const TRANS_DUR_B = 0.75;     // seconds per backward transition
    const TRANS_ZOOM = 0.50;      // outgoing scene zooms in by up to 50% FOV while dissolving into the NEXT (different) scene
    const TRANS_SETTLE = 0.12;    // incoming scene arrives 12% zoomed and settles back (deceleration feel)
    const BLUR_TAPS = 4;          // zoom-blur streak passes at mid-transition (speed cue)
    const BLUR_SPREAD = 0.045;    // FOV spread between blur taps

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function normalize(v) { return ((v % 360) + 360) % 360; }

    // surface any runtime error on screen instead of a silent stuck loader
    window.addEventListener("error", (e) => {
      const el = document.getElementById("loader");
      if (el) { el.classList.remove("done"); el.textContent = "오류: " + (e.message || e.error); }
    });

    // ---------- tiny mat4 helpers (column-major) ----------
    function mPerspective(fovyDeg, aspect, near, far) {
      const f = 1 / Math.tan(fovyDeg * Math.PI / 360);
      const nf = 1 / (near - far);
      return [
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ];
    }
    function mMul(a, b) {
      const o = new Array(16);
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
          o[c * 4 + r] =
            a[0 * 4 + r] * b[c * 4 + 0] +
            a[1 * 4 + r] * b[c * 4 + 1] +
            a[2 * 4 + r] * b[c * 4 + 2] +
            a[3 * 4 + r] * b[c * 4 + 3];
        }
      }
      return o;
    }
    function mRotX(a) {
      const c = Math.cos(a), s = Math.sin(a);
      return [1, 0, 0, 0, 0, c, s, 0, 0, -s, c, 0, 0, 0, 0, 1];
    }
    function mRotY(a) {
      const c = Math.cos(a), s = Math.sin(a);
      return [c, 0, -s, 0, 0, 1, 0, 0, s, 0, c, 0, 0, 0, 0, 1];
    }

    // ---------- GL setup ----------
    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl", { antialias: true, alpha: false }) ||
               canvas.getContext("experimental-webgl");

    const VS = `
      attribute vec3 aPos; attribute vec2 aUV;
      uniform mat4 uProj; uniform mat4 uView;
      varying vec2 vUV;
      void main(){ vUV = aUV; gl_Position = uProj * uView * vec4(aPos, 1.0); }`;
    const FS = `
      precision mediump float;
      varying vec2 vUV;
      uniform sampler2D uTex;
      uniform float uAlpha;
      uniform float uSharp;
      void main(){
        vec3 col = texture2D(uTex, vUV).rgb;
        if (uSharp > 0.0) {
          // micro-contrast unsharp mask (4-tap) for perceived detail
          vec2 tx = vec2(1.0 / 5120.0, 1.0 / 1440.0);
          vec3 nb = texture2D(uTex, vUV + vec2(tx.x, 0.0)).rgb
                  + texture2D(uTex, vUV - vec2(tx.x, 0.0)).rgb
                  + texture2D(uTex, vUV + vec2(0.0, tx.y)).rgb
                  + texture2D(uTex, vUV - vec2(0.0, tx.y)).rgb;
          col = clamp(col + (col - nb * 0.25) * uSharp, 0.0, 1.0);
        }
        // keep the natural photographic look (very light touch)
        col = (col - 0.5) * 1.02 + 0.5;
        gl_FragColor = vec4(col, uAlpha);
      }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const aPos = gl.getAttribLocation(prog, "aPos");
    const aUV = gl.getAttribLocation(prog, "aUV");
    const uProj = gl.getUniformLocation(prog, "uProj");
    const uView = gl.getUniformLocation(prog, "uView");
    const uAlpha = gl.getUniformLocation(prog, "uAlpha");
    const uSharp = gl.getUniformLocation(prog, "uSharp");
    gl.uniform1i(gl.getUniformLocation(prog, "uTex"), 0);

    // ---------- open cylinder geometry (camera at centre) ----------
    let cylCount = 0;
    (function buildCylinder() {
      const SEG = 120, H = CYL_H, pos = [], uv = [], idx = [];
      for (let i = 0; i <= SEG; i++) {
        const u = i / SEG;                 // UVs stay in [0,1] -> works with CLAMP + NPOT native textures
        const th = (u - 0.5) * Math.PI * 2; // u=0.5 -> theta 0 -> front (the trail); seam (u=0/1) sits behind
        const x = Math.sin(th), z = -Math.cos(th);
        pos.push(x, H / 2, z); uv.push(u, 0);
        pos.push(x, -H / 2, z); uv.push(u, 1);
      }
      for (let i = 0; i < SEG; i++) {
        const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
        idx.push(a, b, c, c, b, d);
      }
      const pb = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, pb);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

      const ub = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, ub);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uv), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(aUV);
      gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);

      const ib = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
      cylCount = idx.length;
    })();

    gl.disable(gl.CULL_FACE);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);   // second transition pass blends over the first
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

    // anisotropic filtering keeps the panorama crisp at oblique cylinder angles
    const anisoExt = gl.getExtension("EXT_texture_filter_anisotropic") ||
                     gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic") ||
                     gl.getExtension("MOZ_EXT_texture_filter_anisotropic");
    const maxAniso = anisoExt ? gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 0;

    const imgTextures = [];   // per-waypoint uploaded texture objects

    // Native-resolution upload (no resample). NPOT is fine because we use
    // CLAMP_TO_EDGE + LINEAR (no mipmaps) and keep all UVs within [0,1].
    // Guard: some (older/mobile) GPUs cap MAX_TEXTURE_SIZE at 4096; a 5120px
    // texture would fail (INVALID_VALUE -> black), so downscale to fit.
    const MAX_TEX = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096;
    let fitCanvas = null;
    function fitToGPU(img) {
      if (img.width <= MAX_TEX && img.height <= MAX_TEX) return img;
      const s = Math.min(MAX_TEX / img.width, MAX_TEX / img.height);
      const w = Math.max(1, Math.floor(img.width * s)), h = Math.max(1, Math.floor(img.height * s));
      if (!fitCanvas) fitCanvas = document.createElement("canvas");
      fitCanvas.width = w; fitCanvas.height = h;
      fitCanvas.getContext("2d").drawImage(img, 0, 0, w, h);
      return fitCanvas;
    }
    function uploadImage(img) {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE2);   // upload on a scratch unit so background loads never disturb units 0/1
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, fitToGPU(img));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      if (anisoExt) gl.texParameterf(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, maxAniso);
      return t;
    }
    function loadImage(src, label) {
      return new Promise((res, rej) => {
        const im = new Image();
        let done = false;
        const timer = setTimeout(() => {
          if (!done) rej(new Error((label || "이미지") + " 로딩 시간초과 (기기 성능/메모리 확인)"));
        }, 20000);
        im.onload = () => { done = true; clearTimeout(timer); try { res(uploadImage(im)); } catch (e) { rej(e); } };
        im.onerror = () => { done = true; clearTimeout(timer); rej(new Error((label || "이미지") + " 디코딩 실패")); };
        im.src = src;
      });
    }

    // ---------- state ----------
    const viewer = document.getElementById("viewer");
    const distanceLabel = document.getElementById("distanceLabel");
    const headingLabel = document.getElementById("headingLabel");
    const zoneLabel = document.getElementById("zoneLabel");
    const zoneName = document.getElementById("zoneName");
    const needle = document.getElementById("needle");
    const forwardBtn = document.getElementById("forwardBtn");
    const backBtn = document.getElementById("backBtn");
    const scanBtn = document.getElementById("scanBtn");
    const waypointWrap = document.getElementById("waypoints");
    const loader = document.getElementById("loader");
    const hint = document.getElementById("hint");

    let currentIndex = 0;
    let yaw = 0, pitch = 0;            // radians
    let yawVel = 0, pitchVel = 0;      // inertia
    let autoScan = false;
    let pointerDown = false, lastX = 0, lastY = 0, moved = false;
    let bob = 0;                        // walk-bob amplitude (radians), decays
    let trans = null;                   // active zone transition: {from, forward, t}
    let lastT = 0;

    waypoints.forEach((point, index) => {
      const button = document.createElement("button");
      button.className = "waypoint";
      button.type = "button";
      button.setAttribute("aria-label", `${point.code} ${point.distance}미터`);
      button.addEventListener("click", () => goTo(index));
      waypointWrap.appendChild(button);
    });

    const SUPERSAMPLE = 1.75;  // render above display resolution, then downscale = crisp anti-aliasing
    const MAX_CANVAS_DIM = 4608;
    let lastVW = 0, lastVH = 0;
    function resize() {
      const w = viewer.clientWidth, h = viewer.clientHeight;
      lastVW = w; lastVH = h;
      let scale = (window.devicePixelRatio || 1) * SUPERSAMPLE;
      if (Math.max(w, h) * scale > MAX_CANVAS_DIM) scale = MAX_CANVAS_DIM / Math.max(w, h);
      scale = Math.max(1, scale);
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      gl.viewport(0, 0, canvas.width, canvas.height);
      needsDraw = true;
    }
    window.addEventListener("resize", resize);

    function goTo(index) {
      const next = clamp(index, 0, waypoints.length - 1);
      if (next === currentIndex || !imgTextures[next]) return;
      const forward = next > currentIndex;
      const prev = currentIndex;       // if a transition is running, chain from its target (the visually current zone)
      currentIndex = next;
      stopScan();

      // street-view dolly: the outgoing scene zooms toward the walker while
      // dissolving into the next zone -> reads as physically striding forward
      trans = { from: prev, forward: forward, t: 0, dur: forward ? TRANS_DUR_F : TRANS_DUR_B };
      bob = forward ? 0.06 : 0.04;
      pulse(forward ? "moving-forward" : "moving-back");
      updateHud();
      updateControls();
      invalidate();
    }

    function easeInOut(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    function rotate(delta) { stopScan(); yawVel += delta; }
    function stopScan() { autoScan = false; scanBtn.classList.remove("active"); }

    function pulse(cls) {
      viewer.classList.remove("moving-forward", "moving-back");
      requestAnimationFrame(() => {
        viewer.classList.add(cls);
        setTimeout(() => viewer.classList.remove(cls), 320);
      });
    }

    function updateControls() {
      backBtn.disabled = currentIndex <= 0;
      forwardBtn.disabled = currentIndex >= waypoints.length - 1;
    }

    const damageBadge = document.getElementById("damageBadge");
    const miniMarker = document.getElementById("miniMarker");
    const miniGps = document.getElementById("miniGps");
    const miniPos = document.getElementById("miniPos");

    function updateHud() {
      const p = waypoints[currentIndex];
      distanceLabel.textContent = `${String(p.distance).padStart(2, "0")}m`;
      zoneLabel.textContent = p.code;
      zoneName.textContent = p.name;
      if (damageBadge) {
        damageBadge.textContent = `훼손 진행 ${p.damage}%`;
        // green -> amber -> red as damage climbs
        const d = p.damage / 100;
        const hue = Math.round(140 - 140 * d);          // 140 (green) -> 0 (red)
        damageBadge.style.color = `hsl(${hue}, 85%, 68%)`;
        damageBadge.style.borderColor = `hsla(${hue}, 85%, 60%, 0.5)`;
        damageBadge.style.background = `hsla(${hue}, 70%, 30%, 0.28)`;
        damageBadge.style.fontWeight = p.damage >= 50 ? "900" : "860";
      }
      // minimap: jump the scan marker to this zone's detection spot, update GPS readout
      if (miniMarker) { miniMarker.style.left = p.mx + "%"; miniMarker.style.top = p.my + "%"; }
      if (miniGps) {
        // each zone samples a different area -> coordinates jump around the region
        const lat = (2.5000 + (p.mx - 40) * 0.00042).toFixed(4);
        const lon = (111.7900 + (p.my - 40) * 0.00038).toFixed(4);
        miniGps.textContent = `${Math.abs(lat)}°S ${lon}°E`;
      }
      if (miniPos) miniPos.textContent = `탐지 지점 · ${p.code} · ${String(p.distance).padStart(2, "0")}m`;
      document.querySelectorAll(".waypoint").forEach((b, i) => {
        b.classList.toggle("active", i === currentIndex);
      });
    }

    // ---------- pointer / input ----------
    viewer.addEventListener("pointerdown", (e) => {
      pointerDown = true; moved = false;
      lastX = e.clientX; lastY = e.clientY;
      yawVel = pitchVel = 0;
      stopScan();
      viewer.setPointerCapture(e.pointerId);
    });
    viewer.addEventListener("pointermove", (e) => {
      if (!pointerDown) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      const s = DRAG_SENS;
      yaw += dx * s;
      pitch = clamp(pitch + dy * s, -PITCH_LIMIT, PITCH_LIMIT);
      yawVel = dx * s * 0.6;
      pitchVel = 0;
      invalidate();
      dismissHint();
    });
    function releasePointer() { pointerDown = false; }
    viewer.addEventListener("pointerup", releasePointer);
    viewer.addEventListener("pointercancel", releasePointer);
    viewer.addEventListener("wheel", (e) => {
      e.preventDefault();
      goTo(currentIndex + (e.deltaY > 0 ? -1 : 1));
    }, { passive: false });
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (e.key === "ArrowUp" || k === "w") { e.preventDefault(); goTo(currentIndex + 1); }
      else if (e.key === "ArrowDown" || k === "s") { e.preventDefault(); goTo(currentIndex - 1); }
      else if (e.key === "ArrowLeft" || k === "a") { e.preventDefault(); rotate(-0.28); }
      else if (e.key === "ArrowRight" || k === "d") { e.preventDefault(); rotate(0.28); }
    });

    document.getElementById("leftBtn").addEventListener("click", () => rotate(-0.35));
    document.getElementById("rightBtn").addEventListener("click", () => rotate(0.35));
    forwardBtn.addEventListener("click", () => goTo(currentIndex + 1));
    backBtn.addEventListener("click", () => goTo(currentIndex - 1));
    document.getElementById("resetBtn").addEventListener("click", () => {
      yaw = 0; pitch = 0; yawVel = pitchVel = 0;
      invalidate();
      if (currentIndex !== 0) goTo(0);
    });
    scanBtn.addEventListener("click", () => {
      autoScan = !autoScan;
      scanBtn.classList.toggle("active", autoScan);
      dismissHint();
    });

    let hintGone = false;
    function dismissHint() {
      if (hintGone) return;
      hintGone = true; hint.classList.add("gone");
    }
    setTimeout(dismissHint, 4200);

    // ---------- render loop (draw only when something changes) ----------
    let needsDraw = true;
    function invalidate() { needsDraw = true; }

    const SHARPEN = 0.28;   // shader micro-contrast on settled scenes (0 during blur taps)
    function drawScene(idx, fovDeg, alpha, sharp) {
      const aspect = canvas.width / canvas.height;
      gl.uniformMatrix4fv(uProj, false, new Float32Array(mPerspective(fovDeg, aspect, 0.01, 10)));
      gl.uniform1f(uAlpha, alpha);
      gl.uniform1f(uSharp, sharp === undefined ? SHARPEN : sharp);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, imgTextures[idx]);
      gl.drawElements(gl.TRIANGLES, cylCount, gl.UNSIGNED_SHORT, 0);
    }

    function render(t) {
      const dt = Math.min((t - lastT) / 1000 || 0, 0.05);
      lastT = t;

      // self-heal canvas size so the scene always fills the viewer
      if (viewer.clientWidth !== lastVW || viewer.clientHeight !== lastVH) {
        resize();
      }

      let animating = false;
      // inertia + damping (glide after release)
      if (!pointerDown && (yawVel || pitchVel)) {
        yaw += yawVel;
        pitch = clamp(pitch + pitchVel, -PITCH_LIMIT, PITCH_LIMIT);
        yawVel *= 0.92; pitchVel *= 0.9;
        if (Math.abs(yawVel) < 1e-4) yawVel = 0;
        if (Math.abs(pitchVel) < 1e-4) pitchVel = 0;
        animating = true;
      }
      if (autoScan) { yaw += 0.10 * dt; animating = true; }
      if (trans) {
        trans.t += dt / trans.dur;
        if (trans.t >= 1) trans = null;
        animating = true;
      }
      if (bob > 1e-4) { bob *= 0.9; animating = true; } else { bob = 0; }

      if (animating) needsDraw = true;

      if (needsDraw) {
        const walkBob = bob ? Math.sin(t * 0.03) * bob : 0;
        const view = mMul(mRotX(-(pitch + walkBob)), mRotY(-yaw));
        gl.uniformMatrix4fv(uView, false, new Float32Array(view));

        gl.clear(gl.COLOR_BUFFER_BIT);
        if (trans) {
          const e = easeInOut(Math.min(trans.t, 1));
          const blur = Math.sin(Math.PI * e);   // zoom-blur strength peaks mid-transition (speed cue)
          if (trans.forward) {
            // incoming zone arrives slightly zoomed and settles back (decelerating stop);
            // outgoing zooms deep into the thicket (~3x) with streak taps while fading
            drawScene(currentIndex, FOV_BASE * (1 - TRANS_SETTLE * (1 - e)), 1, 0);
            const f = FOV_BASE * (1 - TRANS_ZOOM * e);
            drawScene(trans.from, f, (1 - e) * 0.9, 0);
            for (let k = 1; k < BLUR_TAPS; k++) {
              drawScene(trans.from, f * (1 - BLUR_SPREAD * blur * k), (1 - e) * 0.3 * blur, 0);
            }
          } else {
            // striding back: the incoming (wider) world expands hard from telephoto to rest
            const f = FOV_BASE * (1 - TRANS_ZOOM * (1 - e));
            drawScene(currentIndex, f, 1, 0);
            for (let k = 1; k < BLUR_TAPS; k++) {
              drawScene(currentIndex, Math.min(f * (1 + BLUR_SPREAD * blur * k), FOV_BASE), 0.3 * blur, 0);
            }
            drawScene(trans.from, FOV_BASE, 1 - e, 0);
          }
        } else {
          drawScene(currentIndex, FOV_BASE, 1);
        }

        const deg = ((BASE_HEADING + yaw * 180 / Math.PI) % 360 + 360) % 360;
        headingLabel.textContent = `${String(Math.round(deg)).padStart(3, "0")}deg`;
        needle.style.setProperty("--heading", `${deg}deg`);
        needsDraw = false;
      }

      requestAnimationFrame(render);
    }

    // ---------- boot ----------
    function setStatus(msg) {
      loader.classList.remove("done");
      const el = document.getElementById("loaderStatus") || loader;
      el.textContent = msg;
    }

    canvas.addEventListener("webglcontextlost", (e) => {
      e.preventDefault();
      setStatus("GPU 컨텍스트가 끊겼습니다 — 페이지를 새로고침(F5) 해주세요.");
    });

    async function boot() {
      try {
        // cinematic intro: status lines cycle while the real load happens underneath
        const bootLines = [
          "위성 링크 연결",
          "GPS 좌표 고정 · 111.79°E 2.50°S",
          "XAI 훼손 마스크 동기화",
          "현장 파노라마 스트리밍",
          "로드뷰 엔진 준비"
        ];
        let bi = 0;
        setStatus(bootLines[0]);
        const seq = window.setInterval(() => {
          bi = Math.min(bi + 1, bootLines.length - 1);
          setStatus(bootLines[bi]);
        }, 430);
        const minShow = new Promise((r) => window.setTimeout(r, 2000));

        resize();
        gl.clearColor(0.02, 0.04, 0.03, 1);
        imgTextures[0] = await loadImage(waypoints[0].image, waypoints[0].code);
        updateHud(); updateControls();
        needsDraw = true;
        requestAnimationFrame(render);

        await minShow;                       // let the intro breathe before revealing
        window.clearInterval(seq);
        setStatus("현장 진입");
        loader.classList.add("done");        // reveal once the first zone is ready
        // background-load the remaining zones (uploads use unit 2, so the visible scene is untouched)
        for (let i = 1; i < waypoints.length; i++) {
          imgTextures[i] = await loadImage(waypoints[i].image, waypoints[i].code);
        }
      } catch (err) {
        setStatus("오류: " + (err && err.message ? err.message : err));
      }
    }

    if (!gl) {
      loader.textContent = "이 브라우저는 WebGL을 지원하지 않습니다 (브라우저의 하드웨어 가속을 켜고 새로고침).";
    } else {
      boot();
    }

    window.__ecoParsed = true;   // sentinel: reached only when this whole script parsed & ran
  </script>
</body>
</html>
