<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Dive · soccz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --bg: #faf7f2;
      --bg-warm: #f5f0e8;
      --bg-dot: rgba(196,114,78,0.06);
      --surface: #ffffff;
      --border: #e5ddd3;
      --border-light: #eee7de;
      --border-hover: #d4c8b8;
      --text: #1a1410;
      --text-secondary: #5c4f42;
      --text-muted: #96887a;
      --text-light: #b5a898;
      --accent: #c4724e;
      --accent-light: #fdf0ea;
      --accent-hover: #b06240;
      --accent-soft: #e8a98a;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body:    'Inter', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:   'Nanum Myeongjo', 'Noto Serif KR', serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
      background-size: 28px 28px;
      background-attachment: fixed;
    }
    a { color: var(--accent); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--accent-hover); }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      height: 64px;
      display: flex; align-items: center;
      padding: 0 28px;
      background: rgba(250,247,242,0.88);
      backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border-light);
    }
    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
    }
    .brand a { color: inherit; }
    .brand .dot { color: var(--accent); }
    .crumbs {
      margin-left: 18px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .crumbs a { color: var(--text-secondary); }
    .actions { margin-left: auto; }
    .actions a {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-family: var(--font-display);
    }
    .actions a:hover { border-color: var(--accent); color: var(--accent); }

    /* Hero */
    .hero {
      max-width: 920px;
      margin: 0 auto;
      padding: 100px 32px 60px;
      text-align: center;
    }
    .hero .eyebrow {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      background: var(--accent-light);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 38px;
    }
    .hero h1 {
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 26px;
      word-break: keep-all;
    }
    .hero .subtitle {
      max-width: 700px;
      margin: 0 auto 0;
      color: var(--text-secondary);
      font-size: 1.04rem;
      line-height: 1.85;
      word-break: keep-all;
    }
    .hero .subtitle .accent { color: var(--accent); font-weight: 600; }

    /* Meta strip */
    .meta-strip {
      max-width: 700px;
      margin: 36px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 0.8rem;
    }
    .meta-strip .chip {
      font-family: var(--font-display);
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .meta-strip .chip.id {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
    }

    /* Stats row */
    .stats {
      max-width: 900px;
      margin: 80px auto 0;
      padding: 0 32px;
      display: flex;
      justify-content: center;
      gap: clamp(40px, 8vw, 100px);
      flex-wrap: wrap;
    }
    .stat {
      text-align: center;
      min-width: 90px;
    }
    .stat .num {
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
    }
    .stat .label {
      margin-top: 12px;
      font-family: var(--font-display);
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* CTA row */
    .ctas {
      max-width: 900px;
      margin: 72px auto 0;
      padding: 0 32px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 28px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      text-decoration: none !important;
    }
    .cta:hover {
      border-color: var(--text);
      transform: translateY(-1px);
      color: var(--text);
    }
    .cta.primary {
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .cta.primary:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .cta svg { width: 16px; height: 16px; }

    /* Section blocks */
    section.what,
    section.tour,
    section.preview {
      max-width: 900px;
      margin: 100px auto 0;
      padding: 0 32px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      margin-bottom: 18px;
    }
    section.what h2,
    section.tour h2,
    section.preview h2 {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.9rem;
      line-height: 1.3;
      margin-bottom: 22px;
      word-break: keep-all;
    }
    section.what p {
      color: var(--text-secondary);
      font-size: 1.0rem;
      line-height: 1.85;
      max-width: 700px;
      word-break: keep-all;
    }
    section.what blockquote {
      max-width: 700px;
      margin: 24px 0 0;
      padding: 16px 22px;
      background: var(--accent-light);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      color: var(--text);
      font-style: italic;
      line-height: 1.7;
    }

    .tour-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }
    .tour-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 22px 20px;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tour-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(26,20,16,0.06);
    }
    .tour-card .num {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .tour-card .ttl {
      font-family: var(--font-display);
      font-size: 1.0rem;
      font-weight: 600;
      color: var(--text);
    }
    .tour-card .desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-top: 4px;
    }
    .tour-card a {
      margin-top: auto;
      padding-top: 12px;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
    }

    /* Preview viz */
    .preview .viz-frame {
      margin-top: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(26,20,16,0.04);
    }
    .preview .viz-frame .viz-block-label {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .preview .viz-frame .viz-block-label::before {
      content: ''; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent);
    }
    .preview .viz-frame canvas {
      width: 100%;
      height: 340px;
      background: var(--bg-warm);
      border-radius: 10px;
      display: block;
    }
    .preview .viz-frame .viz-controls {
      margin-top: 14px;
      display: flex; flex-wrap: wrap;
      gap: 14px 22px; align-items: center;
      font-size: 0.85rem;
    }
    .preview .viz-frame .viz-controls label {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 0.82rem;
    }
    .preview .viz-frame .viz-controls input[type="range"] {
      width: 130px; accent-color: var(--accent);
    }
    .preview .viz-frame .viz-controls .val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem; color: var(--accent);
      min-width: 38px; text-align: right; font-weight: 600;
    }
    .preview .viz-frame .viz-controls button {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit; font-size: 0.82rem;
    }
    .preview .cta-secondary {
      display: inline-block;
      margin-top: 20px;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    /* Footer */
    .site-footer {
      max-width: 900px;
      margin: 120px auto 0;
      padding: 40px 32px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-light);
    }

    .loading-state {
      text-align: center;
      padding: 120px 20px;
      color: var(--text-muted);
    }
    .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
  </style>

        { num: '13',    ttl: 'ASCII 도식 + viz 카탈로그', desc: 'Phase transition · signal-strengthening · MP spectrum 등 11개 도식 + 8개 인터랙티브 viz 한 곳에.',              link: 'read.html?slug=' + encodeURIComponent('2026-05-17_lettau-pelger-rppca') + '#sec-13',  text: '시각화 카탈로그 →' }
      ],
      preview: {
        title: '맛보기 — Phase Transition 인터랙티브',
        subtitle: '아래 슬라이더로 γ(평균 페널티 가중), σ²_F(요인 분산), μ_F(요인 평균)를 직접 조작해보세요. ' +
                  'PCA(점선)는 임계값 아래에선 영원히 못 잡지만, γ를 키우면 RP-PCA(주황 점)가 임계값을 넘어 검출됩니다.',
        vizType: 'rppca-phase-transition'
      }
    }
  };

  async function loadMeta() {
    try {
      const r = await fetch('manifest.json', { cache: 'no-cache' });
      const m = await r.json();
      return m.papers.find(p => p.slug === slug);
    } catch (e) { return null; }
  }

  function render(paper, cfg) {
    const mount = document.getElementById('mount');
    if (!paper || !cfg) {
      mount.innerHTML = `<div class="loading-state">
        Deep Dive 설정 없음: <code>${escapeHtml(slug)}</code><br>
        <small>이 논문은 일반 카드로만 운영됩니다. <a href="./?paper=${encodeURIComponent(slug)}">표준 뷰어로 가기 →</a></small>
      </div>`;
      return;
    }

    document.title = `${paper.title_ko || paper.title} · Deep Dive`;

    const tags = (paper.tags || []).slice(0, 5).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('');
    const ident = paper.identifier ? `<span class="chip id">${escapeHtml(paper.identifier)}</span>` : '';
    const venue = paper.venue ? `<span class="chip">${escapeHtml(paper.venue)}</span>` : '';
    const date  = paper.date ? `<span class="chip">${escapeHtml(paper.date)}</span>` : '';
    const authors = paper.authors ? `<span class="chip">${escapeHtml(paper.authors.split(',')[0])} et al.</span>` : '';

    const stats = cfg.stats.map(s =>
      `<div class="stat"><div class="num">${escapeHtml(s.num)}</div><div class="label">${escapeHtml(s.label)}</div></div>`
    ).join('');

    const tourCards = cfg.tour.map(t => `
      <article class="tour-card">
        <div class="num">${escapeHtml(t.num)}</div>
        <div class="ttl">${escapeHtml(t.ttl)}</div>
        <div class="desc">${escapeHtml(t.desc)}</div>
        <a href="${escapeHtml(t.link)}">${escapeHtml(t.text)}</a>
      </article>
    `).join('');

    const githubFolder = `https://github.com/soccz/paper/tree/main/2026/${slug}`;
    const readUrl = `read.html?slug=${encodeURIComponent(slug)}`;
    const insightUrl = readUrl + '#sec-11';

    mount.innerHTML = `
      <section class="hero">
        <span class="eyebrow">${escapeHtml(cfg.eyebrow)}</span>
        <h1>${escapeHtml(cfg.hero)}</h1>
        <p class="subtitle">${cfg.subtitle}</p>
        <div class="meta-strip">
          ${authors}${venue}${date}${ident}${tags}
        </div>
      </section>

      <section class="stats">${stats}</section>

      <section class="ctas">
        <a class="cta" href="${escapeHtml(githubFolder)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.3-3.3-.1-.3-.6-1.6.1-3.4 0 0 1-.3 3.3 1.3a11.5 11.5 0 0 1 6 0c2.3-1.6 3.3-1.3 3.3-1.3.7 1.8.2 3.1.1 3.4.8.9 1.3 2 1.3 3.3 0 4.7-2.9 5.7-5.6 6 .5.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
          GitHub 원본
        </a>
        <a class="cta primary" href="${escapeHtml(readUrl)}">본문 longform 읽기 →</a>
      </section>
      <p style="text-align:center;margin-top:14px;font-size:0.84rem;color:var(--text-muted);">
        또는 아래 <strong>Reading tour</strong> 에서 원하는 입구로 바로 들어가세요.
      </p>

      <section class="what">
        <div class="section-title">What is this</div>
        <h2>${escapeHtml(cfg.what.title)}</h2>
        <p>${escapeHtml(cfg.what.body)}</p>
        <blockquote>"${escapeHtml(cfg.what.verdict)}"</blockquote>
      </section>

      <section class="tour">
        <div class="section-title">Reading tour · 어디부터 들어갈지</div>
        <h2>이 논문을 6가지 입구로.</h2>
        <div class="tour-grid">${tourCards}</div>
      </section>

      <section class="preview">
        <div class="section-title">맛보기</div>
        <h2>${escapeHtml(cfg.preview.title)}</h2>
        <p style="max-width:700px;color:var(--text-secondary);line-height:1.85;">${escapeHtml(cfg.preview.subtitle)}</p>
        <div class="viz-frame">
          <div class="viz-block-label">interactive · ${escapeHtml(cfg.preview.vizType)}</div>
          <canvas id="previewCanvas"></canvas>
        </div>
        <a class="cta-secondary" href="${escapeHtml(readUrl)}#sec-13">→ 시각화 8개 모두 카탈로그로 보기</a>
      </section>
    `;

    /* Activate preview viz */
    setTimeout(() => {
      const canvas = document.getElementById('previewCanvas');
      const fn = window.VIZ_REGISTRY && window.VIZ_REGISTRY[cfg.preview.vizType];
      if (!canvas || typeof fn !== 'function') return;
      let controls = canvas.parentElement.querySelector('.viz-controls');
      if (!controls) {
        controls = document.createElement('div');
        controls.className = 'viz-controls';
        canvas.parentElement.appendChild(controls);
      }
      try {
        if (fn.length >= 3) fn(canvas, controls, {});
        else                fn(canvas, {});
      } catch (e) { console.error('preview viz error', e); }
    }, 100);
  }

  (async () => {
    const paper = await loadMeta();
    const cfg = LANDING[slug];
    render(paper, cfg);
  })();
</script>

</body>
</html>
