# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      verify_retry:
        description: 'Verify automatic recovery from a missing-artifact error'
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore verified report PDFs
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/pages-pdf-cache
          key: pages-pdf-${{ runner.os }}-${{ hashFiles('scripts/optimize-pages-pdfs.py') }}-${{ hashFiles('projects/k-e-r/**/*.pdf') }}
          restore-keys: |
            pages-pdf-${{ runner.os }}-${{ hashFiles('scripts/optimize-pages-pdfs.py') }}-
      - name: Setup PDF verification Python
        uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Install PDF optimization tools
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check 'PyMuPDF==1.27.2.3'
          if ! command -v gs >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ghostscript
          fi
      - name: Optimize and verify report PDF deployment copies
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/optimize-pages-pdfs.py --root projects/k-e-r --cache "$RUNNER_TEMP/pages-pdf-cache"
      - name: Report published site size
        shell: bash
        run: |
          # Match upload-pages-artifact's default exclusion of hidden paths.
          site_bytes=$(find . -name '.*' ! -name . -prune -o -type f -printf '%s\n' | awk '{total += $1} END {printf "%.0f", total}')
          limit_bytes=1073741824
          percent=$((site_bytes * 100 / limit_bytes))
          printf '### Published site size\n\n%s bytes (%s%% of 1 GiB).\n' "$site_bytes" "$percent" >> "$GITHUB_STEP_SUMMARY"
          if (( site_bytes >= limit_bytes * 9 / 10 )); then
            echo "::warning::Site uses ${percent}% of the 1 GiB Pages limit. Move growing document archives to separate storage before capacity is exhausted."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        # Recover from transient artifact lookup failures and Pages timeouts.
        # The retry remains fatal so persistent failures are still reported.
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # Manual verification fails before creating a deployment; the retry uses the real artifact.
          artifact_name: ${{ inputs.verify_retry && 'pages-retry-verification-missing' || 'github-pages' }}
      - name: Wait before retrying deployment
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 30
      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
      - name: Report recovered deployment
        if: ${{ steps.deployment_retry.outcome == 'success' }}
        run: echo 'Pages deployment succeeded on the second attempt after an initial failure.' >> "$GITHUB_STEP_SUMMARY"
